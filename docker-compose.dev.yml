name: ${PROJECT}_front_web_dev
services:
  web:
    image: node:20-alpine
    container_name: ${C_WEB}
    env_file:
      - .env.dev
    environment:
      - VITE_API_BASE=${VITE_API_BASE}
      - VITE_API_PREFIX=${VITE_API_PREFIX}
      - VITE_APP_TITLE=${VITE_APP_TITLE}
      - VITE_APP_VERSION=${VITE_APP_VERSION}
      - VITE_API_PROXY_TARGET=${VITE_API_PROXY_TARGET:-http://subwayaiv2-api-web-dev:8001}
      - RUN_MODE=docker
    working_dir: /app
    ports:
      - "${APP_PORT:-3001}:3001"
    networks:
      - net
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  net:
    external: true
    name: ${NET}

